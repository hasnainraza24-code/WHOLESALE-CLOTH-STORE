<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Checkout | Raza Wholesale Cloths</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

    <!-- Navigation Bar -->

    <header class="navbar">

        <div class="logo">
            Raza Wholesale Cloths
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="products.html">
                Products
            </a>

            <a href="cart.html">
                Cart
            </a>

            <a href="profile.html">
                Profile
            </a>

        </nav>

    </header>


    <!-- Checkout -->

    <main>

        <section class="checkout-section">

            <h1>
                Checkout
            </h1>


            <div class="checkout-container">


                <!-- Customer Details -->

                <div class="checkout-form">

                    <h2>
                        Delivery Details
                    </h2>


                    <form id="checkoutForm">


                        <div class="form-group">

                            <label for="name">
                                Full Name
                            </label>

                            <input
                                type="text"
                                id="name"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="email">
                                Email
                            </label>

                            <input
                                type="email"
                                id="email"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="phone">
                                Phone Number
                            </label>

                            <input
                                type="tel"
                                id="phone"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="address">
                                Delivery Address
                            </label>

                            <textarea
                                id="address"
                                rows="4"
                                required
                            ></textarea>

                        </div>


                        <div class="checkout-row">

                            <div class="form-group">

                                <label for="city">
                                    City
                                </label>

                                <input
                                    type="text"
                                    id="city"
                                    required
                                >

                            </div>


                            <div class="form-group">

                                <label for="pincode">
                                    Pincode
                                </label>

                                <input
                                    type="text"
                                    id="pincode"
                                    required
                                >

                            </div>

                        </div>


                        <button
                            type="submit"
                            class="place-order-button"
                        >
                            Place Order
                        </button>


                        <p
                            id="checkoutMessage"
                            class="checkout-message"
                        ></p>


                    </form>

                </div>


                <!-- Order Summary -->

                <div class="order-summary">

                    <h2>
                        Order Summary
                    </h2>


                    <div
                        id="checkoutItems"
                        class="checkout-items"
                    >

                        <p>
                            Loading cart...
                        </p>

                    </div>


                    <div class="checkout-total">

                        <span>
                            Total
                        </span>

                        <strong id="checkoutTotal">
                            ₹0
                        </strong>

                    </div>

                </div>


            </div>

        </section>

    </main>


    <!-- JavaScript -->

    <script src="./js/main.js"></script>

    <script src="./js/checkout.js"></script>

</body>

</html>
