<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Checkout | Raza Wholesale Cloths</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

    <!-- Navigation Bar -->

    <header class="navbar">

        <a href="index.html" class="logo">
            Raza Wholesale Cloths
        </a>


        <nav class="main-nav">

            <a href="index.html" class="nav-link">
                <i class="fa-solid fa-house"></i>
                <span>Home</span>
            </a>

            <a href="products.html" class="nav-link">
                <i class="fa-solid fa-shirt"></i>
                <span>Products</span>
            </a>

            <a href="cart.html" class="nav-link">
                <i class="fa-solid fa-bag-shopping"></i>
                <span>Cart</span>
            </a>

            <a href="login.html" class="nav-link">
                <i class="fa-solid fa-user"></i>
                <span>Login</span>
            </a>

        </nav>


        <button
            class="mobile-menu-button"
            id="mobileMenuButton"
            type="button"
            aria-label="Open navigation menu"
            aria-expanded="false"
        >
            <i class="fa-solid fa-bars"></i>
        </button>

    </header>


    <!-- Mobile Sidebar -->

    <aside class="mobile-sidebar" id="mobileSidebar">

        <div class="sidebar-header">

            <span>Menu</span>

            <button
                class="sidebar-close-button"
                id="sidebarCloseButton"
                type="button"
                aria-label="Close navigation menu"
            >
                <i class="fa-solid fa-xmark"></i>
            </button>

        </div>


        <nav class="sidebar-nav">

            <a href="index.html" class="sidebar-link">
                <i class="fa-solid fa-house"></i>
                <span>Home</span>
            </a>

            <a href="products.html" class="sidebar-link">
                <i class="fa-solid fa-shirt"></i>
                <span>Products</span>
            </a>

            <a href="cart.html" class="sidebar-link">
                <i class="fa-solid fa-bag-shopping"></i>
                <span>Cart</span>
            </a>

            <a href="login.html" class="sidebar-link">
                <i class="fa-solid fa-user"></i>
                <span>Login</span>
            </a>

        </nav>

    </aside>


    <div class="sidebar-overlay" id="sidebarOverlay"></div>


    <!-- Checkout -->

    <main>

        <section class="checkout-section">

            <h1>
                Checkout
            </h1>


            <div class="checkout-container">


                <!-- Customer Details -->

                <div class="checkout-form">

                    <h2>
                        Delivery Details
                    </h2>


                    <form id="checkoutForm">


                        <div class="form-group">

                            <label for="name">
                                Full Name
                            </label>

                            <input
                                type="text"
                                id="name"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="email">
                                Email
                            </label>

                            <input
                                type="email"
                                id="email"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="phone">
                                Phone Number
                            </label>

                            <input
                                type="tel"
                                id="phone"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="address">
                                Delivery Address
                            </label>

                            <textarea
                                id="address"
                                rows="4"
                                required
                            ></textarea>

                        </div>


                        <div class="checkout-row">

                            <div class="form-group">

                                <label for="city">
                                    City
                                </label>

                                <input
                                    type="text"
                                    id="city"
                                    required
                                >

                            </div>


                            <div class="form-group">

                                <label for="pincode">
                                    Pincode
                                </label>

                                <input
                                    type="text"
                                    id="pincode"
                                    required
                                >

                            </div>

                        </div>


                        <button
                            type="submit"
                            class="place-order-button"
                        >
                            Place Order
                        </button>


                        <p
                            id="checkoutMessage"
                            class="checkout-message"
                        ></p>


                    </form>

                </div>


                <!-- Order Summary -->

                <div class="order-summary">

                    <h2>
                        Order Summary
                    </h2>


                    <div
                        id="checkoutItems"
                        class="checkout-items"
                    >

                        <p>
                            Loading cart...
                        </p>

                    </div>


                    <div class="checkout-total">

                        <span>
                            Total
                        </span>

                        <strong id="checkoutTotal">
                            ₹0
                        </strong>

                    </div>

                </div>


            </div>

        </section>

    </main>


    <!-- JavaScript -->

    <script src="./js/main.js"></script>

    <script src="./js/checkout.js"></script>

</body>

</html>
