<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Raza Wholesale Cloths</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

    <!-- Navigation Bar -->

    <header class="navbar">

        <div class="logo">
            Raza Wholesale Cloths
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="products.html">
                Products
            </a>

            <a href="cart.html">
                Cart
            </a>

            <a href="login.html">
                Login
            </a>

        </nav>

    </header>


    <!-- Login -->

    <main>

        <section class="login-section">

            <div class="login-card">

                <h1>
                    Welcome Back
                </h1>

                <p class="login-subtitle">
                    Login to your account
                </p>


                <form id="loginForm">

                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="login-button"
                    >
                        Login
                    </button>


                    <p
                        id="loginMessage"
                        class="login-message"
                    ></p>

                    <p class="register-link">

                        Don't have an account?

                        <a href="register.html">
                            Register
                        </a>

                    </p>

                </form>

            </div>

        </section>

    </main>


    <!-- JavaScript -->

    <script src="js/login.js"></script>

</body>

</html>
