<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Products | Wholesale Cloth Store</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

            <!-- HEADER -->

        <header class="navbar">

            <div class="logo">
                Raza Wholesale Cloths
            </div>

            <nav>

                <a href="index.html">
                    Home
                </a>

                <a href="products.html">
                    Products
                </a>

                <a href="cart.html">
                    Cart
                </a>

                <a href="login.html">
                    Login
                </a>

            </nav>

        </header>


    <!-- MAIN CONTENT -->

    <main>

        <section class="products-section">

            <h2>
                Our Products
            </h2>


            <!-- SEARCH -->

            <div class="search-container">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search products..."
                >

                <button id="searchButton">
                    Search
                </button>

            </div>


            <!-- SORT -->

            <div class="sort-container">

                <button id="sortButton">
                    Sort by Price
                </button>

            </div>


            <!-- PRODUCTS -->

            <div
                id="productsContainer"
                class="products-container"
            >

                <p>
                    Loading products...
                </p>

            </div>

        </section>

    </main>


    <!-- JAVASCRIPT -->
    <script src="./js/main.js"></script>
    <script src="./js/products.js"></script>

</body>

</html>
