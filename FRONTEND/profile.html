<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Profile | Raza Wholesale Cloths</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

    <!-- Navigation Bar -->

    <header class="navbar">

        <div class="logo">
            Raza Wholesale Cloths
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="products.html">
                Products
            </a>

            <a href="cart.html">
                Cart
            </a>

            <a href="profile.html">
                Profile
            </a>

        </nav>

    </header>


    <!-- Profile -->

    <main>

        <section class="profile-section">

            <div class="profile-card">

                <div class="profile-icon">
                    👤
                </div>

                <h1>
                    My Profile
                </h1>


                <div class="profile-info">

                    <div class="profile-field">

                        <span>
                            Name
                        </span>

                        <strong id="profileName">
                            Loading...
                        </strong>

                    </div>


                    <div class="profile-field">

                        <span>
                            Email
                        </span>

                        <strong id="profileEmail">
                            Loading...
                        </strong>

                    </div>

                </div>


                <button
                    id="logoutButton"
                    class="logout-button"
                >
                    Logout
                </button>

            </div>

        </section>

    </main>


    <!-- JavaScript -->

    <script src="js/profile.js"></script>

</body>

</html>
