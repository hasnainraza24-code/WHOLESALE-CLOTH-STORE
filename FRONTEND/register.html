<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register | Raza Wholesale Cloths</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

    <!-- Navigation Bar -->

    <header class="navbar">

        <div class="logo">
            Raza Wholesale Cloths
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="products.html">
                Products
            </a>

            <a href="cart.html">
                Cart
            </a>

            <a href="login.html">
                Login
            </a>

        </nav>

    </header>


    <!-- Register -->

    <main>

        <section class="login-section">

            <div class="login-card">

                <h1>
                    Create Account
                </h1>

                <p class="login-subtitle">
                    Register for your account
                </p>


                <form id="registerForm">

                    <div class="form-group">

                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            placeholder="Enter your name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="registerEmail">
                            Email
                        </label>

                        <input
                            type="email"
                            id="registerEmail"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="registerPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="registerPassword"
                            placeholder="Create a password"
                            minlength="6"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm your password"
                            minlength="6"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="login-button"
                    >
                        Create Account
                    </button>


                    <p
                        id="registerMessage"
                        class="login-message"
                    ></p>


                    <p class="register-link">

                        Already have an account?

                        <a href="login.html">
                            Login
                        </a>

                    </p>

                </form>

            </div>

        </section>

    </main>


    <script src="js/register.js"></script>

</body>

</html>
